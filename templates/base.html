<!DOCTYPE html>
{% load static %}

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">

  <title>{% block title %}Developer Alex{% endblock %}</title>

  <meta content="{% block description %}Alex Mwenda - IT Professional and Software Developer{% endblock %}"
        name="description">

  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="{% static 'img/favicon.png' %}" rel="icon">
  <link href="{% static 'img/apple-touch-icon.png' %}" rel="apple-touch-icon">

  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css?family=Open+Sans:300,300i,400,400i,600,600,700|Raleway:300,300i,400,400i,500,500i,600,600i,700|Poppins:300,300i,400,400i,500,500i,600,600i,700"
    rel="stylesheet">

  <!-- AOS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css"
        rel="stylesheet">

  <!-- Vendor CSS Files -->
  <link href="{% static 'vendor/aos/aos.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/boxicons/css/boxicons.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
  <link href="{% static 'vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">

  <!-- Main CSS -->
  <link href="{% static 'css/style.css' %}" rel="stylesheet">

  {% block extra_css %}{% endblock %}
</head>


<body>

  <!-- ======= Mobile nav toggle button ======= -->
  <i class="bi bi-list mobile-nav-toggle d-xl-none"></i>


  <!-- ======= Header ======= -->
  <header id="header">

    <div class="container d-flex align-items-center justify-content-between">

      <!-- Logo / Profile Image -->
      <div class="logo d-flex align-items-center">

        <a href="{% url 'home' %}">
          <img src="{% static 'img/alexis-logo.png' %}"
               alt="Alex Mwenda"
               class="img-fluid rounded-circle">
        </a>

        <h1 class="text-light">
          <a href="{% url 'home' %}">Alex Mwenda</a>
        </h1>

      </div>


      <!-- Navigation Menu -->
      <nav id="navbar" class="nav-menu navbar">

        <ul class="d-flex">

          <li>
            <a href="{% url 'home' %}#hero"
               class="nav-link scrollto">
              <i class="bx bx-home"></i>
              Home
            </a>
          </li>

          <li>
            <a href="{% url 'home' %}#skills"
               class="nav-link scrollto">
              <i class="bx bx-server"></i>
              Skills
            </a>
          </li>

          <li>
            <a href="{% url 'journey_projects' %}"
               class="nav-link scrollto">
              <i class="bx bx-briefcase"></i>
              Projects
            </a>
          </li>

        </ul>

      </nav>


      <!-- Social Media Links -->
      <div class="social-links d-flex">

        <a href="https://x.com/Alexisan297"
           target="_blank"
           rel="noopener noreferrer"
           class="twitter">
          <i class="bx bxl-twitter"></i>
        </a>

        <a href="https://facebook.com/your_username"
           target="_blank"
           rel="noopener noreferrer"
           class="facebook">
          <i class="bx bxl-facebook"></i>
        </a>

        <a href="https://instagram.com/_alex_mwenda"
           target="_blank"
           rel="noopener noreferrer"
           class="instagram">
          <i class="bx bxl-instagram"></i>
        </a>

        <a href="https://skype.com/your_username"
           target="_blank"
           rel="noopener noreferrer"
           class="google-plus">
          <i class="bx bxl-skype"></i>
        </a>

        <a href="https://www.linkedin.com/in/alex-mwenda"
           target="_blank"
           rel="noopener noreferrer"
           class="linkedin">
          <i class="bx bxl-linkedin"></i>
        </a>

        <a href="https://github.com/your_username"
           target="_blank"
           rel="noopener noreferrer"
           class="github">
          <i class="bx bxl-github"></i>
        </a>

        <a href="https://wa.me/25474638795"
           target="_blank"
           rel="noopener noreferrer"
           class="whatsapp">
          <i class="bx bxl-whatsapp"></i>
        </a>

      </div>

    </div>

  </header>
  <!-- ======= End Header ======= -->


  <!-- ======= Main Content ======= -->
  <main id="main">

    {% block content %}
    {% endblock %}

  </main>
  <!-- ======= End Main Content ======= -->


  <!-- ======= Footer ======= -->
  <footer id="footer">

    <div class="container">

      <div class="copyright">
        &copy; {% now "Y" %}
        <strong>
          <span>Alex Mwenda</span>
        </strong>
      </div>

      <div class="credits">
        Designed by
        <a href="https://www.linkedin.com/in/alex-mwenda"
           target="_blank"
           rel="noopener noreferrer">
          Alex
        </a>
      </div>

    </div>

  </footer>
  <!-- ======= End Footer ======= -->


  <!-- Back to top -->
  <a href="#"
     class="back-to-top d-flex align-items-center justify-content-center">

    <i class="bi bi-arrow-up-short"></i>

  </a>


  <!-- ======= Vendor JS Files ======= -->

  <script src="{% static 'vendor/purecounter/purecounter_vanilla.js' %}"></script>

  <script src="{% static 'vendor/aos/aos.js' %}"></script>

  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>

  <script src="{% static 'vendor/glightbox/js/glightbox.min.js' %}"></script>

  <script src="{% static 'vendor/isotope-layout/isotope.pkgd.min.js' %}"></script>

  <script src="{% static 'vendor/swiper/swiper-bundle.min.js' %}"></script>

  <script src="{% static 'vendor/typed.js/typed.min.js' %}"></script>

  <script src="{% static 'vendor/waypoints/noframework.waypoints.js' %}"></script>

  <script src="{% static 'vendor/php-email-form/validate.js' %}"></script>


  <!-- Main JS -->
  <script src="{% static 'js/main.js' %}"></script>


  {% block extra_js %}
  {% endblock %}


  <!-- AOS initialization -->
  <script>
    AOS.init();
  </script>

</body>

</html>
